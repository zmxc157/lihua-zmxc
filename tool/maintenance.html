<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メンテナンス中 · 网站维护中</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A7%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* 蔚蓝档案（基沃托斯）配色 */
      --ba-deep:   #0a1426;
      --ba-navy:   #0d1b33;
      --ba-blue:   #2773e1;
      --ba-sky:    #53bcfe;
      --ba-cyan:   #7fd8ff;
      --ba-line:   rgba(83, 188, 254, 0.45);
      --ba-text:   #d7ecff;
      --ba-sub:    #8fb6e0;
      --ba-gold:   #ffd56b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "M PLUS Rounded 1c", "Zen Maru Gothic", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ba-text);
      background:
        radial-gradient(1200px 700px at 50% -10%, rgba(46, 139, 208, 0.30), transparent 60%),
        radial-gradient(900px 600px at 85% 110%, rgba(83, 188, 254, 0.12), transparent 60%),
        linear-gradient(160deg, var(--ba-navy) 0%, var(--ba-deep) 100%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 远景星点 */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .stars i {
      position: absolute;
      width: 2px; height: 2px;
      background: #cfeaff;
      border-radius: 50%;
      opacity: .5;
      box-shadow: 0 0 6px rgba(127, 216, 255, .8);
      animation: twinkle 3.5s ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.8} }

    /* 漂浮几何粒子（十字 / 圆点，军事学园风） */
    .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .ambient span {
      position: absolute;
      color: rgba(127, 216, 255, .35);
      font-size: 18px;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: .5; }
      90%  { opacity: .5; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }

    /* 中心面板 */
    .panel {
      position: relative;
      z-index: 1;
      width: min(92vw, 540px);
      padding: 46px 38px 40px;
      text-align: center;
      background: linear-gradient(160deg, rgba(20, 42, 75, 0.82), rgba(10, 22, 44, 0.86));
      border: 1px solid var(--ba-line);
      border-radius: 22px;
      box-shadow:
        0 0 0 1px rgba(83, 188, 254, 0.12),
        0 24px 70px rgba(0, 0, 0, 0.55),
        0 0 50px rgba(39, 115, 225, 0.25);
      backdrop-filter: blur(6px);
    }

    /* SCHALE 风格光环（不完整圆环） */
    .halo {
      width: 92px; height: 92px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--ba-sky);
      border-right-color: var(--ba-blue);
      background:
        radial-gradient(circle at 50% 50%, rgba(83, 188, 254, 0.18), transparent 62%);
      position: relative;
      animation: spin 6s linear infinite;
      box-shadow: 0 0 24px rgba(83, 188, 254, 0.35);
    }
    .halo::after {
      content: "🔧";
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
      animation: spin 6s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .jp {
      font-size: 13px;
      letter-spacing: 0.18em;
      color: var(--ba-sub);
      margin-bottom: 6px;
    }

    /* BA 风渐变标题（浮空通透感） */
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #bfeaff 0%, #5fb8ff 55%, #2773e1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 22px rgba(83, 188, 254, 0.45);
      filter: drop-shadow(0 2px 0 rgba(255, 255, 255, 0.18));
      margin-bottom: 4px;
    }

    .status {
      margin: 16px 0 6px;
      font-size: 17px;
      font-weight: 500;
      color: var(--ba-text);
    }

    .divider {
      height: 1px;
      margin: 20px auto;
      width: 70%;
      background: linear-gradient(to right, transparent, var(--ba-line), transparent);
    }

    /* 信息行 */
    .info {
      text-align: left;
      background: rgba(13, 27, 51, 0.55);
      border: 1px solid rgba(83, 188, 254, 0.22);
      border-left: 3px solid var(--ba-sky);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 15px;
    }
    .info .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .info .k { color: var(--ba-sky); font-weight: 700; white-space: nowrap; }
    .info .v { color: var(--ba-text); }
    .info a {
      color: var(--ba-cyan);
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px dashed rgba(127, 216, 255, 0.6);
    }
    .info a:hover { color: #fff; }

    /* BA 风按钮 */
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 30px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      background: linear-gradient(135deg, var(--ba-blue), var(--ba-sky));
      box-shadow: 0 8px 22px rgba(39, 115, 225, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transition: transform .15s ease, filter .15s ease;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: var(--ba-sub);
      letter-spacing: 0.04em;
    }
    .footer .star { color: var(--ba-gold); }
  </style>
</head>
<body>
  <!-- 远景星点 -->
  <div class="stars" id="stars"></div>
  <!-- 漂浮几何粒子 -->
  <div class="ambient" id="ambient"></div>

  <main class="panel">
    <div class="halo"></div>
    <p class="jp">ただいまメンテナンス中です</p>
    <h1>网站维护中</h1>

    <p class="status">当前网站正在维护中</p>

    <div class="divider"></div>

    <div class="info">
      <div class="row">
        <span class="k">📧 联系邮箱</span>
        <span class="v"><a href="mailto:1578929129@qq.com">1578929129@qq.com</a></span>
      </div>
      <div class="row">
        <span class="k">🕒 维护时间</span>
        <span class="v">10月20日 12：00 ~ 9999/12/31</span>
      </div>
    </div>

    <a class="btn" href="mailto:1578929129@qq.com">📨 联系我们</a>

    <p class="footer">ご不便をおかけしております <span class="star">✦</span> 恢复后我们将第一时间通知</p>
  </main>

  <script>
    // 远景星点
    (function () {
      var stars = document.getElementById('stars');
      for (var i = 0; i < 40; i++) {
        var s = document.createElement('i');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 3.5).toFixed(2) + 's';
        stars.appendChild(s);
      }
      // 漂浮几何粒子
      var amb = document.getElementById('ambient');
      var glyphs = ['+', '✦', '◈', '+', '·'];
      for (var j = 0; j < 14; j++) {
        var sp = document.createElement('span');
        sp.textContent = glyphs[j % glyphs.length];
        sp.style.left = Math.random() * 100 + '%';
        sp.style.fontSize = (12 + Math.random() * 16).toFixed(0) + 'px';
        sp.style.animationDuration = (10 + Math.random() * 10).toFixed(1) + 's';
        sp.style.animationDelay = (Math.random() * 12).toFixed(1) + 's';
        amb.appendChild(sp);
      }
    })();
  </script>
</body>
</html>
