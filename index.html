<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">星辰桑切片站</title>
  <link rel="icon" type="image/svg+xml" id="favicon-link" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 樱花粒子背景 -->
  <div class="sakura-container" id="sakura-container"></div>

  <!-- 飘落樱花 -->
  <div class="falling-petals" id="falling-petals"></div>

  <!-- 顶部横幅（可编辑） -->
  <div class="hero-banner" id="hero-banner">
    <div class="hero-inner">
      <h1 class="hero-title" id="hero-title">🌸 星辰桑切片站 🌸</h1>
      <p class="hero-desc" id="hero-desc">收录星辰桑的所有可爱切片，愿你喜欢 ✨</p>
    </div>
    <div class="hero-petals">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
    </div>
  </div>

  <!-- 搜索栏 -->
  <div class="search-section">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" class="search-input" placeholder="🔎 搜索切片标题、分类或发布者..." autocomplete="off" />
      <button class="search-clear" id="search-clear" style="display:none">✕</button>
    </div>
    <div class="filter-tabs" id="filter-tabs"></div>
    <div class="result-count" id="result-count"></div>
  </div>

  <!-- 问卷区域 -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-sakura">🌸</div>
      <h2 class="modal-title" id="modal-title">问卷调查</h2>
      <p class="modal-body" id="modal-body">请填写以下问卷</p>
      <a id="modal-link" href="#" target="_blank" class="btn-pink" rel="noopener noreferrer">前往填写 →</a>
    </div>
  </div>

  <!-- 问卷浮动按钮（fab 位置，右下角常驻） -->
  <div id="questionnaire-fab" class="q-fab" style="display:none" title="问卷调查" role="button" aria-label="问卷调查">
    <span class="q-fab-icon">🌸</span>
    <span class="q-fab-text">问卷</span>
  </div>

  <!-- 星辰NEWS 弹窗（公告/活动/异常，每次访问弹出） -->
  <div id="news-modal" class="modal-overlay news-modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-label="星辰NEWS">
    <div class="news-card">
      <div class="news-head">
        <div class="news-title-wrap">
          <div class="news-logo">🌸</div>
          <div>
            <div class="news-name">星辰NEWS</div>
            <div class="news-sub">STAR NEWS · 来自星辰桑的最新消息</div>
          </div>
        </div>
        <button class="modal-close news-close" id="news-modal-close">✕</button>
      </div>
      <div class="news-body-area">
        <!-- 加载中（1-3s 后才显示内容） -->
        <div class="news-loading" id="news-loading">
          <div class="win-spinner" aria-hidden="true"></div>
          <p class="news-loading-text">NowLoading…</p>
        </div>
        <div class="news-main" id="news-main" style="display:none">
          <div class="news-tabs" id="news-tabs"></div>
          <div class="news-layout">
            <div class="news-list" id="news-list"></div>
            <div class="news-detail" id="news-detail">
              <!-- 手机二级页顶栏：返回公告列表（桌面双栏模式自动隐藏） -->
              <div class="news-back-bar" id="news-back-bar">
                <button type="button" class="news-back-btn" id="news-back-btn" aria-label="返回公告列表">‹ 返回列表</button>
                <span class="news-back-title" id="news-back-title"></span>
              </div>
              <div class="news-detail-scroll" id="news-detail-scroll">
                <div class="news-detail-empty">👈 选择左侧一条消息查看详情</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 外部链接提示 -->
  <div id="external-modal" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <button class="modal-close" id="external-modal-close">✕</button>
      <div class="modal-sakura">⚠️</div>
      <h2 class="modal-title">即将跳转到站外</h2>
      <p class="modal-body">即将前往第三方视频平台，链接安全性由对方负责。<br>确认继续吗？</p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn-outline" id="external-cancel">取消</button>
        <a id="external-confirm" href="#" target="_blank" class="btn-pink" rel="noopener noreferrer">确认跳转 →</a>
      </div>
    </div>
  </div>

  <!-- 切片详情弹窗（自适应大小，超高时内部滚动 + 顶部进度条） -->
  <div id="detail-modal" class="modal-overlay" style="display:none">
    <div class="modal-card modal-wide detail-card">
      <div class="modal-progress" id="detail-progress"><i id="detail-progress-bar"></i></div>
      <button class="modal-close" id="detail-modal-close">✕</button>
      <div class="modal-scroll" id="detail-scroll">
        <!-- 加载提示（手机版：弹窗中央 Windows 11 风格旋转动画 + 正在加载文本，1-3s 后显示内容） -->
        <div class="detail-loading" id="detail-loading">
          <div class="win-spinner" aria-hidden="true"></div>
          <p class="detail-loading-text">正在加载…</p>
        </div>
        <div id="detail-content">
          <div class="detail-cover" id="detail-cover"></div>
          <h2 class="modal-title" id="detail-title"></h2>
          <div class="detail-meta" id="detail-meta"></div>
          <p class="detail-note" id="detail-note"></p>
          <div id="detail-audio"></div>
          <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px">
            <button class="btn-outline" id="detail-cancel">关闭</button>
            <button class="btn-pink" id="detail-watch">🎬 观看原视频 →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- NowLoading：PC 右下角详情加载提示（默认同网页字体文本，或服务端指定 PNG，闪动效果写死；手机版固定中央旋转动画，不用此元素） -->
  <div id="now-loading" class="now-loading" role="status" aria-live="polite"></div>

  <!-- 内嵌问卷：列表顶部（list-top 位置） -->
  <div id="inline-q-top"></div>

  <!-- 切片列表 -->
  <main class="main-container">
    <div class="slices-grid" id="slices-grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">🌸</div>
      <p class="empty-text">没有找到匹配的切片呢～</p>
      <p class="empty-sub">试试其他关键词吧 ✨</p>
    </div>
    <div class="loading-state" id="loading-state">
      <div class="loading-ring"></div>
      <p>加载中...</p>
    </div>
    <div class="pagination" id="pagination"></div>
    <!-- 内嵌问卷：列表底部（list-bottom 位置） -->
    <div id="inline-q-bottom"></div>
  </main>

  <!-- 底部 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">🌸 ZMXC</div>
      <div class="footer-links">
        <a href="mailto:1578929129@qq.com" class="footer-link">📧 侵权投诉</a>
      </div>
      <div class="footer-copy">©️ ZMXC · 星辰桑切片收录站</div>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    // 页面初始化
    document.addEventListener('DOMContentLoaded', () => initSite());
  </script>
</body>
</html>
